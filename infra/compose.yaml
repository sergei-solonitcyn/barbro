name: barbro

x-hardening: &hardening
  cap_drop:
    - ALL
  read_only: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true

services:

  api:
    <<: *hardening
    image: ${API_IMAGE:?API_IMAGE is required}
    environment:
      - DB_PATH=/data/barbro.db
      # Public: the client ID is in every sign-in URL.
      - GOOGLE_CLIENT_ID=844936264243-08o25ep43ul7orfqpm0bc3ab0mvu6k4t.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET_FILE=/run/secrets/google-client-secret
      - PUBLIC_ORIGIN=https://barbro.dev
    ports:
      - "127.0.0.1:3000:3000"
    secrets:
      - google-client-secret
    stop_grace_period: 20s
    volumes:
      - api-data:/data

  web:
    <<: *hardening
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    ports:
      - "127.0.0.1:8081:8080"
    stop_grace_period: 10s
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0700

  edge:
    <<: *hardening
    image: caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9

    # The official image grants /usr/bin/caddy the file capability
    # cap_net_bind_service. With cap_drop: ALL the kernel refuses to execute it;
    # keeping this one capability in the bounding set lets the binary start.
    # The server listens on 8080 and needs no privilege itself.
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - api
      - web
    ports:
      - "127.0.0.1:8082:8080"
    stop_grace_period: 20s
    tmpfs:
      - /data:uid=65532,gid=65532,mode=0700
    user: "65532:65532"
    volumes:
      - ./edge/Caddyfile:/etc/caddy/Caddyfile:ro

  tunnel:
    <<: *hardening
    image: cloudflare/cloudflared:2026.10.0@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    command: [ "tunnel", "--grace-period", "15s", "run", "--token-file", "/run/secrets/tunnel-token" ]
    depends_on:
      - edge
    profiles:
      - tunnel
    secrets:
      - tunnel-token
    stop_grace_period: 20s

secrets:
  google-client-secret:
    # Created by hand on the server (root:65532, 0440); the CI smoke test points it at a dummy file.
    file: ${GOOGLE_CLIENT_SECRET_PATH:-/etc/barbro/google-client-secret}
  tunnel-token:
    # Created by hand on the server; see infra/README.md.
    file: /etc/barbro/tunnel-token

volumes:
  api-data:
