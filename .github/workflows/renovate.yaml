name: renovate

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Renovate log level'
        type: choice
        options:
          - debug
          - info
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        id: renovate-app-token
      - uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_DOCKER_MAX_PAGES: 10
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          renovate-image: "docker.io/renovate/renovate:44.151.0@sha256:8a79148ec24cc05809782e20e720dafe9dde0c24a00f26e76d14dec2cbd74a53"
          token: ${{ steps.renovate-app-token.outputs.token }}
