name: renovate

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Renovate log level'
        type: choice
        options:
          - debug
          - info
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        id: renovate-app-token
      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_DOCKER_MAX_PAGES: 10
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          renovate-image: "docker.io/renovate/renovate:44.133.0@sha256:05c512c35c764ef6a179e69c3b30567eca254d67f13a0143479fe3c84852c67a"
          token: ${{ steps.renovate-app-token.outputs.token }}
