name: renovate

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Renovate log level'
        type: choice
        options:
          - debug
          - info
        default: info

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
        id: renovate-app-token
      - uses: renovatebot/github-action@f0f41e5f2e706165f6814b1d0f0d0e319de7d1d9 # v46.3.8
        env:
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}
          RENOVATE_DOCKER_MAX_PAGES: 10
          RENOVATE_PLATFORM_COMMIT: enabled
          RENOVATE_REPOSITORIES: ${{ github.repository }}
        with:
          renovate-image: "docker.io/renovate/renovate:44.156.3@sha256:c4ddbd5d809072dcf8a4ee0655eef602a847522de9922d338de7b1f8019e73e7"
          token: ${{ steps.renovate-app-token.outputs.token }}
